server {
    listen 80;
    root /usr/share/nginx/html;

    # No trailing slash after the upstream, so /api/books reaches the API as /api/books.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Client-side routes such as /cart and /orders/{id} all load index.html.
    location / {
        try_files $uri /index.html;
    }
}
