name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: NUnit unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - run: dotnet test tests/Shelf.UnitTests --logger "console;verbosity=normal" --logger "trx;LogFileName=unit.trx"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results
          path: tests/Shelf.UnitTests/TestResults/*.trx
          retention-days: 7

  integration:
    name: NUnit integration tests (SQL Server in a container)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      # Testcontainers starts mcr.microsoft.com/mssql/server:2022-latest on the runner's Docker.
      - run: dotnet test tests/Shelf.IntegrationTests --logger "console;verbosity=normal" --logger "trx;LogFileName=integration.trx"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-results
          path: tests/Shelf.IntegrationTests/TestResults/*.trx
          retention-days: 7

  e2e:
    name: Docker images + Playwright end-to-end tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Throwaway SQL Server password for this run
        run: |
          PW="Ci_$(openssl rand -hex 12)_Aa1"
          echo "::add-mask::$PW"
          echo "MSSQL_SA_PASSWORD=$PW" >> "$GITHUB_ENV"

      - name: Build Docker images (api, fulfilment, web)
        run: docker compose build

      - name: Start the stack
        run: docker compose up -d

      - name: Wait for the API through the storefront proxy
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000/api/books | grep -q pride-and-prejudice; then exit 0; fi
            sleep 3
          done
          docker compose ps; docker compose logs api; exit 1

      # On a new broker an OrderPlaced published before the worker has bound its queue would have nowhere to go,
      # so wait until the order-placed queue has a consumer.
      - name: Wait for the fulfilment worker to consume order-placed
        run: |
          for i in $(seq 1 60); do
            if curl -fsS -u guest:guest http://localhost:15672/api/queues/%2F/order-placed | grep -q '"consumers":[1-9]'; then exit 0; fi
            sleep 3
          done
          docker compose logs fulfilment; exit 1

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci
        working-directory: e2e
      - run: npm run typecheck
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npx playwright test
        working-directory: e2e
        env:
          CI: "true"

      - name: Container logs on failure
        if: failure()
        run: docker compose logs

      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

      - if: always()
        run: docker compose down -v
