name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

# Every job is pinned to ubuntu-24.04, the image `ubuntu-latest` means today. GitHub starts moving that label to
# Ubuntu 26.04 on 2026-10-19 (actions/runner-images#14748), and for a few weeks a run could land on either image.
# Move to 26.04 on purpose, after one green run on it.
jobs:
  unit:
    name: NUnit unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - run: dotnet test tests/Shelf.UnitTests --logger "console;verbosity=normal" --logger "trx;LogFileName=unit.trx"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results
          path: tests/Shelf.UnitTests/TestResults/*.trx
          retention-days: 90

  integration:
    name: NUnit integration tests (SQL Server and RavenDB in containers)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      # Testcontainers starts mcr.microsoft.com/mssql/server:2022-latest and ravendb/ravendb:7.2-ubuntu-latest on
      # the runner's Docker.
      - run: dotnet test tests/Shelf.IntegrationTests --logger "console;verbosity=normal" --logger "trx;LogFileName=integration.trx"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-results
          path: tests/Shelf.IntegrationTests/TestResults/*.trx
          retention-days: 90

  mutation:
    name: Stryker.NET mutation testing of the fulfilment worker
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - run: dotnet tool restore
      # Mutates OrderFulfilment.cs and OrderPlacedConsumer.cs (see stryker-config.json) and runs the unit tests
      # against each mutant. Reports only; the score does not fail the build.
      - run: dotnet stryker
        working-directory: tests/Shelf.UnitTests
      - name: Mutation report in the job summary
        if: always()
        run: cat tests/Shelf.UnitTests/StrykerOutput/*/reports/mutation-report.md >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report
          path: tests/Shelf.UnitTests/StrykerOutput/*/reports
          retention-days: 90

  web:
    name: Storefront lint and strict TypeScript build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: src/Shelf.Web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/Shelf.Web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  e2e:
    name: Docker images, cold-start check and Playwright end-to-end tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Throwaway SQL Server password for this run
        run: |
          PW="Ci_$(openssl rand -hex 12)_Aa1"
          echo "::add-mask::$PW"
          echo "MSSQL_SA_PASSWORD=$PW" >> "$GITHUB_ENV"

      # Built here to run the stack; nothing is pushed to a registry.
      - name: Build Docker images (api, fulfilment, web)
        run: docker compose build

      - name: Start the stack without the fulfilment worker
        run: docker compose up -d sqlserver ravendb rabbitmq api web

      # On a fresh broker: place an order before the worker has ever run, see the event wait in its queue, start
      # the worker, see the order fulfilled. Then stop RabbitMQ, check out, start it again, see that order fulfilled.
      # This also starts the worker for the browser tests below.
      - name: Cold start and broker outage checks
        run: bash e2e/cold-start-check.sh

      - name: Wait for the storefront proxy
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/books | grep -q pride-and-prejudice; then exit 0; fi
            sleep 2
          done
          docker compose logs web api; exit 1

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci
        working-directory: e2e
      - run: npm run typecheck
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npx playwright test
        working-directory: e2e
        env:
          CI: "true"

      - name: Container logs on failure
        if: failure()
        run: docker compose logs

      # The report holds each test's video, trace and step screenshots; demo/ holds the named step screenshots.
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 90
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-demo
          path: |
            e2e/demo
            e2e/test-results/**/*.webm
            e2e/test-results/**/trace.zip
          retention-days: 90

      - if: always()
        run: docker compose down -v
